# On-demand diagnostic: does the honest UA still get 200 from the runner's IPs?
#
# Cloudflare weighs UA and client IP together. floridapolitics.com 403'd until
# 2026-08-18 and unblocking it was a deliberate win, so it was checked from a
# runner before ingestion moved here - byte-identical to the laptop, 7/7 OK.
#
# Kept rather than deleted, because it answers a question that recurs: if a
# source starts failing only in Actions, run this before touching ingest.py.
# probe.py follows each source's configured route, so it measures what the
# pipeline actually depends on.
#
#   gh workflow run probe.yml --ref main
name: ip-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Record which network we are judging, so a pass or fail can be attributed
      # to a specific range rather than to "Actions" in the abstract.
      - name: Runner network
        run: curl -s https://ipinfo.io/json || true

      # continue-on-error: probe.py exits non-zero if any source is not OK, and
      # tbtimes is expected to come back THIN from every network right now (it
      # serves a 75-word subscriber wall). A red job here would be misleading;
      # the table in the log is the result.
      - name: Probe
        continue-on-error: true
        run: python probe.py
